[versions]
shadow = "9.6.1"
junit = "5.14.4"
junitPlatform = "1.14.4"

# Paper API, one entry per supported Minecraft line.
# 1.21.11 API is compiled to Java 21 bytecode; 26.x API is Java 25 bytecode.
paperV1211 = "1.21.11-R0.1-SNAPSHOT"
paperV2612 = "26.1.2.build.74-stable"
paperV262 = "26.2.build.129-stable"

packetevents = "2.14.0"
hikaricp = "7.1.0"
sqliteJdbc = "3.53.4.0"
mysqlConnector = "26.7.0"
placeholderapi = "2.11.6"

[libraries]
paperApi = { module = "io.papermc.paper:paper-api", version.ref = "paperV1211" }
paperApiV2612 = { module = "io.papermc.paper:paper-api", version.ref = "paperV2612" }
paperApiV262 = { module = "io.papermc.paper:paper-api", version.ref = "paperV262" }

packeteventsSpigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }

hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
sqliteJdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
mysqlConnectorJ = { module = "com.mysql:mysql-connector-j", version.ref = "mysqlConnector" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }

junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
