# SealCore - Tiếng Việt.
#
# Mọi chuỗi hiện ra người chơi đều nằm ở đây, một file cho một ngôn ngữ. File
# đang dùng được chỉ định bởi `lang` trong config.yml, ví dụ `lang: vi.yml`.
#
# Khóa được đặt theo module, nên `economy.pay-sent-chat` thuộc module
# `economy`. Một khóa thiếu ở file này sẽ lùi về `languages/en.yml` trước khi
# hiện nguyên chuỗi khóa đó.
#
# MiniMessage: <accent> là màu chữ đậm của SealCore, đặt trong config.yml. Đổi
# `general.accent-color` là đổi màu ở tất cả các file ngôn ngữ.

prefix: '<accent>SealCore</accent> <dark_gray>»<gray> '

core:
  no-permission: '<red>Bạn không có quyền làm điều đó.'
  player-only: '<red>Lệnh này chỉ chạy trong game.'
  module-disabled: '<red>Module <white><module></white> đang tắt.'
  reloaded: '<green>SealCore đã tải lại.'
  reload-partial: '<yellow>SealCore đã tải lại có vấn đề: <white><details></white>'
  storage-unavailable: '<red>SealCore không truy cập được dữ liệu, một số tính năng đang bị tắt.'
  restart-required: '<yellow><white><key></white> thay đổi và sẽ áp dụng ở lần khởi động tới.'

economy:
  # /balance
  balance-self: '<white>Bạn có <green><money>'
  balance-other: '<accent><player> <white>có <green><money>'
  # /pay - người gửi
  pay-sent-chat: '<white>Bạn đã gửi <green><money> <white>tới <accent><player>'
  pay-sent-actionbar: '<white>Đã gửi <green><money> <white>tới <accent><player>'
  # /pay - người nhận
  pay-received-chat: '<accent><player> <white>đã gửi <green><money><white> tới <accent>bạn'
  pay-received-actionbar: '<accent><player>đã gửi <green><money>'
  # /pay - lỗi
  pay-self: '<red>Bạn không thể gửi tiền cho chính mình.'
  pay-amount-range: '<red>Số tiền phải từ <white><min></white> đến <white><max></white>.'
  pay-cooldown: '<red>Chờ <white><seconds> giây</white> rồi hãy gửi tiếp.'
  pay-failed: '<red>Giao dịch thất bại, hãy thử lại.'
  player-not-found: '<red>Không tìm thấy người chơi <white><player></white>.'
  # Dùng chung
  provider-absent: '<red>Chưa nạp hệ kinh tế, không đọc được số dư.'
  unknown-currency: '<red>Không biết loại tiền: <white><currency></white>.'
  insufficient-funds: '<red>Bạn cần <white><amount></white> nhưng chỉ có <white><balance></white>.'
  invalid-amount: '<red>Số tiền không hợp lệ.'

gui:
  closed: ''
  back: '<gray>Quay lại'
  previous-page: '<yellow>« Trang trước'
  next-page: '<yellow>Trang sau »'

command:
  usage: '<gray>Cách dùng: <white><usage>'
  unknown-subcommand: '<red>Không biết lệnh con: <white><input></white>.'
