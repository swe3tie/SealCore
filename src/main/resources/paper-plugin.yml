name: SealCore
# Expanded by the build to <version>+<branch>.<commit>.
version: '${version}'
main: sealmc.swe3tie.sealcore.SealCore
loader: sealmc.swe3tie.sealcore.SealCoreLoader
api-version: '1.21.11'
description: All-in-one economy SMP plugin for Paper and Folia.
author: swe3tie
website: https://github.com/swe3tie
folia-supported: true
load: POSTWORLD

dependencies:
  server:
    ExcellentEconomy:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    packetevents:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  sealcore.admin:
    description: Every SealCore admin permission.
    default: op
    children:
      sealcore.command: true
      sealcore.command.reload: true
      sealcore.command.module: true
      sealcore.command.debug: true
      sealcore.economy.pay.bypass: true
      sealcore.economy.sell: true
  sealcore.economy.pay:
    description: Allow sending money via /pay.
    default: true
  sealcore.economy.balance:
    description: Allow viewing own balance via /balance or /bal.
    default: true
  sealcore.economy.balance.others:
    description: Allow viewing other players balances via /balance <player>.
    default: true
  sealcore.economy.sell:
    description: Allow selling items via /sell.
    default: true
  sealcore.economy.pay.bypass:
    description: Bypass cooldown and transaction limits for /pay.
    default: op
