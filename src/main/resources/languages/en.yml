# SealCore - English (fallback for every other language)
# Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   <accent>     colour from config.yml general.accent-color
#   <prefix>     the prefix below
#   <name>       per-message placeholders, listed next to each message
# A message may be a single string or a list of lines. Set it to '' to hide it.
# PlaceholderAPI placeholders (%...%) work when the hook is enabled.

config-version: 1

prefix: '<accent><bold>SealCore</bold></accent> <dark_gray>»</dark_gray> '

core:
  no-permission: '<prefix><red>You do not have permission to do that.'
  players-only: '<prefix><red>Only players can use this.'
  player-not-found: '<prefix><red>Player <white><player></white> was not found.'
  invalid-number: '<prefix><red><input> is not a valid amount.'
  module-disabled: '<prefix><red>This feature is currently disabled.'
  hook-missing: '<prefix><red>This feature needs <white><hook></white>, which is not installed.'
  reload:
    success: '<prefix><green>Reloaded in <white><time>ms</white>.'
    failed: '<prefix><red>Reload failed: <white><error></white>. Check the console.'
  version: '<prefix><gray>Running <accent>SealCore <version></accent> on <white><server></white>.'
  module:
    list-header: '<prefix><gray>Modules (<white><count></white>):'
    # <state>: ENABLED, DISABLED, FAILED...
    list-entry: '<dark_gray> - </dark_gray><white><module></white> <dark_gray>[</dark_gray><state><dark_gray>]</dark_gray>'
    unknown: '<prefix><red>Unknown module <white><module></white>.'
    enabled: '<prefix><green>Module <white><module></white> enabled.'
    disabled: '<prefix><yellow>Module <white><module></white> disabled.'
    reloaded: '<prefix><green>Module <white><module></white> reloaded.'
    failed: '<prefix><red>Module <white><module></white> failed: <white><error></white>.'
  help:
    - '<accent><bold>SealCore</bold></accent> <dark_gray>-</dark_gray> <gray><version>'
    - '<white>/sealcore reload</white> <dark_gray>-</dark_gray> <gray>reload configs and languages'
    - '<white>/sealcore module list|enable|disable|reload <id></white>'
    - '<white>/sealcore version</white> <dark_gray>|</dark_gray> <white>/sealcore debug</white>'
