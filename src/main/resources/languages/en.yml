# SealCore - English (fallback for every other language)
# Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#
# Primary color: <#9CC0D9>
#
# Placeholders are formatted as: {PLACEHOLDER_NAME}
# Specific placeholders are listed and explained before each message section.
# Set any message to '' to hide it completely.

config-version: 1

# ──────────────────────────────────────────────────────────────
# SECTION 1: CORE SYSTEM MESSAGES
# ──────────────────────────────────────────────────────────────
core:
  # Shown when a player lacks permission to run a command.
  no-permission: '<red>You do not have permission to do that.'

  # Shown when console runs a player-only command.
  players-only: '<red>Only players can use this command.'

  # Shown when target player is not found.
  # Placeholder: {PLAYER} - Target player name
  player-not-found: '<red>Player <white>{PLAYER}</white> was not found.'

  # Shown when input is not a valid number.
  # Placeholder: {INPUT} - Raw string input
  invalid-number: '<red><white>{INPUT}</white> is not a valid amount.'

  # Shown when the requested feature or module is disabled.
  module-disabled: '<red>This feature is currently disabled.'

  # Shown when a required plugin dependency is missing.
  # Placeholder: {HOOK} - Missing plugin name
  hook-missing: '<red>This feature needs <white>{HOOK}</white>, which is not installed.'

  # Command usage feedback shown on actionbar with villager no sound on invalid syntax.
  # Placeholder: {USAGE} - Command usage syntax (e.g. /pay <player> <amount>)
  command-usage: '<red>Usage: <white>{USAGE}</white>'

  # Plugin reload feedback (/sealcore reload).
  reload:
    # Placeholder: {TIME} - Reload duration in milliseconds
    success: '<green>Reloaded in <white>{TIME}ms</white>.'
    # Placeholder: {ERROR} - Error message if reload failed
    failed: '<red>Reload failed: <white>{ERROR}</white>. Check the console.'

  # Plugin version feedback (/sealcore version).
  # Placeholder: {VERSION} - SealCore version; {SERVER} - Server brand and Minecraft version
  version: '<gray>Running <#9CC0D9>SealCore {VERSION}</#9CC0D9> on <white>{SERVER}</white>.'

  # Module administration feedback (/sealcore module).
  # Placeholder: {COUNT} - Total number of modules; {MODULE} - Module id; {STATE} - Status; {ERROR} - Error message
  module:
    list-header: '<gray>Modules (<white>{COUNT}</white>):'
    list-entry: '<dark_gray> - </dark_gray><white>{MODULE}</white> <dark_gray>[</dark_gray>{STATE}<dark_gray>]</dark_gray>'
    unknown: '<red>Unknown module <white>{MODULE}</white>.'
    enabled: '<green>Module <white>{MODULE}</white> enabled.'
    disabled: '<yellow>Module <white>{MODULE}</white> disabled.'
    reloaded: '<green>Module <white>{MODULE}</white> reloaded.'
    failed: '<red>Module <white>{MODULE}</white> failed: <white>{ERROR}</white>.'

  # Help menu displayed by /sealcore.
  # Placeholder: {VERSION} - Current plugin version
  help:
    - '<#9CC0D9><bold>SealCore</bold></#9CC0D9> <dark_gray>-</dark_gray> <gray>{VERSION}</gray>'
    - '<white>/sealcore reload</white> <dark_gray>-</dark_gray> <gray>reload configs and languages</gray>'
    - '<white>/sealcore module list|enable|disable|reload <id></white> <dark_gray>-</dark_gray> <gray>manage modules</gray>'
    - '<white>/sealcore version</white> <dark_gray>|</dark_gray> <white>/sealcore debug</white>'

# ──────────────────────────────────────────────────────────────
# SECTION 2: ECONOMY MODULE
# ──────────────────────────────────────────────────────────────
economy:
  # Balance command (/balance or /bal).
  balance:
    # Placeholder: {MONEY} - Formatted money balance (e.g. 1,234.56)
    self: '<white>You have <green>${MONEY}</green>'
    # Placeholder: {PLAYER} - Target player name; {MONEY} - Target player's balance
    other: '<#9CC0D9>{PLAYER}</#9CC0D9> <white>has <green>${MONEY}</green>'
    failed: '<red>Could not load balance.'

  # Pay command (/pay <player> <amount>).
  # Placeholder: {AMOUNT} - Sent/received amount formatted compactly (e.g. 69.77M); {PLAYER} - Target player name
  pay:
    sender:
      chat: '<white>You sent <green>${AMOUNT}</green> <white>to <#9CC0D9>{PLAYER}</#9CC0D9>'
      actionbar: '<white>Sent <green>${AMOUNT}</green> <white>to <#9CC0D9>{PLAYER}</#9CC0D9>'
    receiver:
      chat: '<#9CC0D9>{PLAYER}</#9CC0D9> <white>sent <green>${AMOUNT}</green> <white>to you'
      actionbar: '<#9CC0D9>{PLAYER}</#9CC0D9> <white>Sent <green>${AMOUNT}</green>'
      offline: '<#9CC0D9>{PLAYER}</#9CC0D9> <white>sent <green>${AMOUNT}</green> <white>to you while you were offline'
    # Shown when sender has insufficient funds.
    not-enough: '<red>You do not have enough money.'
    # Shown when attempting to pay oneself.
    self: '<red>You cannot send money to yourself.'
    # Shown when the transaction failed.
    failed: '<red>The payment failed. You were not charged.'
    # Placeholder: {SECONDS} - Cooldown seconds remaining
    cooldown: '<red>Wait <white>{SECONDS}s</white> before paying again.'
    # Placeholder: {MIN} - Minimum allowed amount; {MAX} - Maximum allowed amount
    out-of-range: '<red>Amount must be between <green>${MIN}</green> <red>and <green>${MAX}</green>.'

  # Sell GUI command (/sell).
  # Placeholder: {TOTAL} - Total sell value; {MONEY} - Total money received
  sell:
    title: '<#9CC0D9>ѕᴇʟʟ ɪᴛᴇᴍѕ</#9CC0D9><dark_gray>:</dark_gray> <green>${TOTAL}</green>'
    sold:
      chat: '<green>+${MONEY}</green>'
      actionbar: '<green>+${MONEY}</green>'
