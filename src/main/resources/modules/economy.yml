# ╭──────────────────────────────────────────────────────────────╮
# │ Module: economy                                              │
# ╰──────────────────────────────────────────────────────────────╯
# Balance, pay and baltop on top of ExcellentEconomy.
# Turn the whole module on/off with modules.economy in config.yml.
# Messages: the "economy" section of your language file.

config-version: 1

# Currencies (SealCore keys from config.yml hooks.excellent-economy.currencies)
# that /balance lists when no currency is given.
balance-currencies:
  - money
  - shards
  - coins

commands:
  # [restart] Command names and aliases are registered once at startup.
  balance:
    name: balance
    aliases: [bal, money]
    permission: sealcore.economy.balance
    other-permission: sealcore.economy.balance.others

submodules:
  pay:
    enabled: true
    command:
      name: pay
      aliases: []
      permission: sealcore.economy.pay
    # Currencies players may send with /pay. The first one is the default.
    currencies: [money]
    min-amount: 1
    max-amount: 1000000000
    cooldown-seconds: 3
    # Holders skip the amount range and cooldown.
    bypass-permission: sealcore.economy.pay.bypass

  baltop:
    enabled: true
    command:
      name: baltop
      aliases: [balancetop]
      permission: sealcore.economy.baltop
    # Uses ExcellentEconomy's leaderboard, which must be enabled there.
    page-size: 10
