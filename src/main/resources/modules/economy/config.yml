# ╭──────────────────────────────────────────────────────────────╮
# │ Module: economy                                              │
# ╰──────────────────────────────────────────────────────────────╯
# Quản lý số dư (/balance), chuyển tiền (/pay) và bán đồ (/sell) kết nối qua ExcellentEconomy.
# Bật/tắt toàn bộ module tại mục modules.economy trong file config.yml.
# Tin nhắn nằm ở languages/, GUI và giá nằm trong thư mục module này.

# Phiên bản cấu hình - không tự ý thay đổi.
config-version: 1

# Cấu hình các lệnh của module economy.
# [restart] Thay đổi tên lệnh (name) và bí danh (aliases) cần khởi động lại server.
commands:
  # Lệnh xem số dư tài khoản.
  balance:
    name: balance
    aliases: [bal]
    # Quyền xem số dư bản thân.
    permission: sealcore.economy.balance
    # Quyền xem số dư người chơi khác (/balance <player>).
    other-permission: sealcore.economy.balance.others

  # Lệnh chuyển tiền giữa các người chơi.
  pay:
    name: pay
    aliases: []
    permission: sealcore.economy.pay
    # Số tiền tối thiểu cho một lần chuyển (người có quyền bypass sẽ bỏ qua).
    min-amount: 1
    # Số tiền tối đa cho một lần chuyển.
    max-amount: 1000000000
    # Thời gian chờ (giây) giữa các lần chuyển tiền.
    cooldown-seconds: 3
    # Quyền bỏ qua giới hạn số tiền và thời gian chờ.
    bypass-permission: sealcore.economy.pay.bypass

  # Lệnh bán vật phẩm qua giao diện GUI (/sell).
  sell:
    name: sell
    aliases: []
    permission: sealcore.economy.sell

  # Lệnh tra cứu giá trị vật phẩm (/worth).
  worth:
    name: worth
    aliases: []
    permission: sealcore.economy.worth

# Cấu hình hiển thị giá trị vật phẩm qua lore (client-side qua PacketEvents).
# Hiển thị khi người chơi di chuột vào vật phẩm bất kỳ trong túi đồ hoặc thùng chứa.
worth-lore:
  # Bật/tắt hiển thị lore giá trị.
  enabled: true
  # Các dòng lore hiển thị trên vật phẩm. Hỗ trợ MiniMessage và các placeholder:
  # {WORTH} - Giá dạng đầy đủ (ví dụ: 1,234.56)
  # {WORTH_FORMATTED} hoặc {WORTH_COMPACT} - Giá dạng thu gọn (ví dụ: 69.77M)
  lines:
    - '<gray>Giá trị: <green>${WORTH_FORMATTED}'

# Cấu hình phân trang chung cho các giao diện (/worth, /sell tiến độ).
pagination:
  # Bật/tắt phân trang (true: cho phép sang trang, false: cố định ở trang 1).
  enabled: true
  # Bật/tắt riêng cho từng giao diện (nếu không đặt sẽ lấy theo enabled ở trên):
  worth: true
  sell-multiplier: true
  # (Tùy chọn) Nút quay lại trang trước và chuyển sang trang sau:
  previous:
    material: ARROW
    name: '<#9CC0D9>ᴛʀᴀɴɢ ᴛʀướᴄ'
    lore:
      - '<white>Nhấp để quay về trang trước'
  next:
    material: ARROW
    name: '<#9CC0D9>ᴛʀᴀɴɢ ѕᴀᴜ'
    lore:
      - '<white>Nhấp để sang trang sau'


