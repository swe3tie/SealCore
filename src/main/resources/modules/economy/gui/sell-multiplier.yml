# ╭──────────────────────────────────────────────────────────────╮
# │ Module: economy / GUI: sell-multiplier                       │
# ╰──────────────────────────────────────────────────────────────╯
# All slots use 1-based numbering. MiniMessage and {PLACEHOLDER} syntax supported.
# Placeholders: {SECTION}, {CURRENT_PAGE}, {MAX_PAGE}, {MULTIPLIER}, {NEXT_MULTIPLIER},
# {CURRENT}, {CURRENT_FORMATTED}, {NEED}, {NEED_FORMATTED}, {TARGET}, {TARGET_FORMATTED},
# {REMAINING}, {REMAINING_FORMATTED}, {PERCENTAGE}, {PROGRESS_BAR}.

config-version: 2

title: '<dark_gray>ᴛɪếɴ độ {SECTION} — {CURRENT_PAGE}/{MAX_PAGE}'
rows: 6
slots: [11, 20, 29, 38, 39, 40, 31, 22, 13, 14, 15, 24, 33, 42, 43, 44, 35, 26, 17, 10]
page-slots:
  1: [11, 20, 29, 38, 39, 40, 31, 22, 13, 14, 15, 24, 33, 42, 43, 44, 35, 26, 17, 18]
  2: [10, 11, 20, 29, 38, 39, 40, 31, 22, 13, 14, 15, 24, 33, 42, 43, 44, 35, 26, 17]
summary-slot: 50
previous-slot: 46
next-slot: 54

# Cấu hình thanh tiến trình {PROGRESS_BAR} dùng chung cho cả giao diện /sell và giao diện tiến độ.
progress-bar:
  length: 16
  complete: '<#9CC0D9>■'
  incomplete: '<dark_gray>■'

previous:
  material: ARROW
  name: '<#9CC0D9>ᴛʀᴀɴɢ ᴛʀướᴄ'
  lore:
    - '<white>Nhấp để quay về trang trước'
next:
  material: ARROW
  name: '<#9CC0D9>ᴛʀᴀɴɢ ѕᴀᴜ'
  lore:
    - '<white>Nhấp để sang trang sau'
panes:
  in-progress:
    material: YELLOW_STAINED_GLASS_PANE
    name: '<yellow>ᴛʀᴏɴɢ ǫᴜá ᴛʀìɴʜ'
    lore:
      - '<white>Hệ số: <#9CC0D9>{MULTIPLIER}x'
      - '<dark_gray>{PROGRESS_BAR} <#9CC0D9>{PERCENTAGE}%'
      - '<gray>{CURRENT_FORMATTED}/{NEED_FORMATTED}'
  completed:
    material: LIME_STAINED_GLASS_PANE
    name: '<green>ʜᴏàɴ ᴛʜàɴʜ'
    lore:
      - '<white>Hệ số: <#9CC0D9>{MULTIPLIER}x'
      - '<dark_gray>{PROGRESS_BAR} <#9CC0D9>{PERCENTAGE}%'
      - '<gray>{CURRENT_FORMATTED}/{NEED_FORMATTED}'
  incomplete:
    material: GRAY_STAINED_GLASS_PANE
    name: '<white>ᴄʜưᴀ ʜᴏàɴ ᴛʜàɴʜ'
    lore:
      - '<white>Hệ số: <#9CC0D9>{MULTIPLIER}x'
      - '<dark_gray>{PROGRESS_BAR} <#9CC0D9>{PERCENTAGE}%'
      - '<gray>{CURRENT_FORMATTED}/{NEED_FORMATTED}'
