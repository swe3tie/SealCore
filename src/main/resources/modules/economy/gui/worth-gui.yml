    material: ARROW
    name: "<#9CC0D9>ᴛʀᴀɴɢ ᴛʀướᴄ"
    lore:
      - "<white>Nhấp để quay về trang trước"
  next:
    material: ARROW
    name: "<#9CC0D9>ᴛʀᴀɴɢ ѕᴀᴜ"
    lore:
      - "<white>Nhấp để sang trang sau"
  sort:
    material: CAULDRON
    name: "<#9CC0D9>ѕắᴘ хếᴘ"
  refresh:
    material: ANVIL
    name: "<#9CC0D9>ɢɪá ᴛʀị ᴠậᴛ ᴘʜẩᴍ"
    lore:
      - "<white>Nhấp để làm mới"
  filter:
    material: HOPPER
    name: "<#9CC0D9>ʟọᴄ"
