# ╭──────────────────────────────────────────────────────────────╮
# │ SealCore - all-in-one Economy SMP plugin                     │
# ╰──────────────────────────────────────────────────────────────╯
# File cấu hình trung tâm của SealCore, quản lý các thiết lập chung của engine,
# kết nối cơ sở dữ liệu và tích hợp các plugin bên ngoài.
#
# Cấu hình riêng cho từng module nằm tại: modules/<module_id>/config.yml
# Toàn bộ thông báo tin nhắn tới người chơi nằm tại: languages/<language_id>.yml
#
# Các khóa bị thiếu sẽ được tự động khôi phục từ bản mặc định khi khởi động/reload,
# giữ nguyên giá trị và chú thích của bạn.
# Các khóa có đánh dấu [restart] chỉ có hiệu lực sau khi khởi động lại hoàn toàn server.

# Phiên bản cấu hình - không tự ý chỉnh sửa. Dùng cho việc tự động migrate giữa các phiên bản.
config-version: 1

# Tên file ngôn ngữ kích hoạt trong thư mục languages/.
# en.yml là ngôn ngữ dự phòng (fallback) cho bất kỳ khóa nào thiếu trong file này.
lang: en.yml

# Cài đặt chung của hệ thống.
general:
  # Bật ghi log chi tiết phục vụ kiểm tra lỗi (debug).
  debug: false

# Cấu hình lưu trữ dữ liệu SQL (SQLite hoặc MySQL/MariaDB).
storage:
  # [restart] Loại database: sqlite hoặc mysql (MariaDB dùng chung tùy chọn mysql).
  type: sqlite
  # Tên file SQLite, lưu tương đối trong thư mục plugins/SealCore/data/.
  file: sealcore.db
  # Cấu hình kết nối MySQL (bỏ qua nếu type là sqlite).
  host: localhost
  port: 3306
  database: sealcore
  username: root
  password: ''
  use-ssl: false
  # Tiền tố cho các bảng của SealCore trong database (tránh trùng lặp khi dùng chung DB).
  table-prefix: 'sealcore_'
  # Cấu hình HikariCP Connection Pool.
  pool:
    maximum-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000
    max-lifetime-ms: 1800000

# Tích hợp với các plugin bên ngoài (Hooks).
hooks:
  # Tích hợp kinh tế với ExcellentEconomy.
  excellent-economy:
    # Nếu true: SealCore sẽ từ chối khởi động nếu thiếu ExcellentEconomy.
    # Khuyến nghị bật true trên server chính thức (production).
    required: false
    # Ánh xạ mã tiền tệ của SealCore sang ID tiền tệ trong ExcellentEconomy.
    # Các module của SealCore luôn tham chiếu theo khóa bên trái.
    currencies:
      money: money
      shards: shards
      coins: coins
    # Loại tiền tệ mặc định khi lệnh/tính năng không chỉ định loại tiền.
    default-currency: money
  # Tích hợp phân giải placeholder PlaceholderAPI (%...%).
  placeholderapi:
    # Tự động parse PlaceholderAPI trong các tin nhắn gửi tới người chơi.
    parse-in-messages: true
  # Tích hợp PacketEvents cho các tính năng can thiệp gói tin (hologram, scoreboard...).
  packetevents:
    # [restart] Bật/tắt hook PacketEvents.
    enabled: true

# Bật/tắt các module tính năng của plugin.
# Các tùy chọn chi tiết của từng module nằm tại: modules/<module_id>/config.yml
# Thay đổi tại đây có hiệu lực ngay sau khi chạy /sealcore reload.
modules:
  economy: true
